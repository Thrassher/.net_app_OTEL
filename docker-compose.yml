services:
  dotnet-test-app:
    container_name: dotnet-test-app

    build:
      context: .
      dockerfile: Dockerfile

    image: dotnet-otel-qa:latest

    ports:
      - "8088:8080"

    env_file:
      - .env

    environment:
      OTEL_EXPORTER_OTLP_HEADERS: "x-api-key=${CODEXRAY_API_KEY}"

    restart: unless-stopped

    networks:
      - codexray-network

networks:
  codexray-network:
    external: true
    name: codexray-network
